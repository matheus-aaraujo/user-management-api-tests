name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -DfailIfNoTests=true test
        if: always()

      - name: Generate Allure Report
        if: always()
        run: bash ./mvnw allure:report

      - name: Zip Allure Report
        if: always()
        run: |
          cd target/site/allure-maven-plugin
          zip -r ../../../allure-report.zip .

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report.zip